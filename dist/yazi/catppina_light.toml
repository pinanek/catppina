[app]
overall = { bg = "#f7f7f8" }

[mgr]
cwd = { fg = "#00675f" }

find_keyword  = { fg = "#765702", italic = true }
find_position = { fg = "#9c356a", bg = "reset", italic = true }

marker_copied   = { fg = "#186846", bg = "#186846" }
marker_cut      = { fg = "#a72f3a", bg = "#a72f3a" }
marker_marked   = { fg = "#00675f", bg = "#00675f" }
marker_selected = { fg = "#16618b", bg = "#16618b" }

count_copied   = { fg = "#f7f7f8", bg = "#186846" }
count_cut      = { fg = "#f7f7f8", bg = "#a72f3a" }
count_selected = { fg = "#f7f7f8", bg = "#16618b" }

border_symbol = "│"
border_style  = { fg = "#89898e" }

syntect_theme = "~/.config/yazi/Catppuccin-latte.tmTheme"

[tabs]
active   = { fg = "#f7f7f8", bg = "#303033", bold = true }
inactive = { fg = "#303033", bg = "#e3e3e5" }

[mode]
normal_main = { fg = "#f7f7f8", bg = "#16618b", bold = true }
normal_alt  = { fg = "#16618b", bg = "#eeeeef"}

select_main = { fg = "#f7f7f8", bg = "#186846", bold = true }
select_alt  = { fg = "#186846", bg = "#eeeeef"}

unset_main  = { fg = "#f7f7f8", bg = "#9f383f", bold = true }
unset_alt   = { fg = "#9f383f", bg = "#eeeeef"}

[indicator]
parent = { fg = "#f7f7f8", bg = "#303033" }
current = { fg = "#f7f7f8", bg = "#16618b" }
preview = { fg = "#f7f7f8", bg = "#303033" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#186846", bg = "#e3e3e5" }
progress_error  = { fg = "#765702", bg = "#a72f3a" }

perm_type  = { fg = "#16618b" }
perm_read  = { fg = "#765702" }
perm_write = { fg = "#a72f3a" }
perm_exec  = { fg = "#186846" }
perm_sep   = { fg = "#89898e" }

[input]
border   = { fg = "#16618b" }
title    = {}
value    = {}
selected = { reversed = true }

[pick]
border   = { fg = "#16618b" }
active   = { fg = "#9c356a" }
inactive = {}

[confirm]
border     = { fg = "#16618b" }
title      = { fg = "#16618b" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}

[cmp]
border = { fg = "#16618b" }

[tasks]
border  = { fg = "#16618b" }
title   = {}
hovered = { fg = "#9c356a", bold = true }

[which]
mask            = { bg = "#eeeeef" }
cand            = { fg = "#00675f" }
rest            = { fg = "#737378" }
desc            = { fg = "#9c356a" }
separator       = "  "
separator_style = { fg = "#d8d8da" }

[help]
on      = { fg = "#00675f" }
run     = { fg = "#9c356a" }
desc    = { fg = "#737378" }
hovered = { bg = "#d8d8da", bold = true }
footer  = { fg = "#303033", bg = "#e3e3e5" }

[notify]
title_info  = { fg = "#00675f" }
title_warn  = { fg = "#765702" }
title_error = { fg = "#a72f3a" }

[filetype]
rules = [
	# Media
	{ mime = "image/*", fg = "#765702" },
	{ mime = "{audio,video}/*", fg = "#9c356a" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a72f3a" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#116285" },

	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#e3e3e5" },

	# Special file
	{ url = "*", is = "orphan", bg = "#a72f3a" },
	{ url = "*", is = "exec"  , fg = "#186846" },

	# Dummy file
	{ url = "*", is = "dummy", bg = "#a72f3a" },
	{ url = "*/", is = "dummy", bg = "#a72f3a" },

	# Fallback
	{ url = "*/", fg = "#16618b" },
]

[spot]
border = { fg = "#16618b" }
title  = { fg = "#16618b" }
tbl_cell = { fg = "#16618b", reversed = true }
tbl_col = { bold = true }

[icon]
dirs = [
	{ name = ".config", text = "", fg = "#16618b" },
	{ name = ".git", text = "", fg = "#16618b" },
	{ name = ".github", text = "", fg = "#16618b" },
	{ name = ".npm", text = "", fg = "#16618b" },
	{ name = "Desktop", text = "", fg = "#16618b" },
	{ name = "Development", text = "", fg = "#16618b" },
	{ name = "Documents", text = "", fg = "#16618b" },
	{ name = "Downloads", text = "", fg = "#16618b" },
	{ name = "Library", text = "", fg = "#16618b" },
	{ name = "Movies", text = "", fg = "#16618b" },
	{ name = "Music", text = "", fg = "#16618b" },
	{ name = "Pictures", text = "", fg = "#16618b" },
	{ name = "Public", text = "", fg = "#16618b" },
	{ name = "Videos", text = "", fg = "#16618b" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#303033" },
	{ if = "link", text = "", fg = "#5b5b5f" },
	{ if = "block", text = "", fg = "#765702" },
	{ if = "char", text = "", fg = "#765702" },
	{ if = "fifo", text = "", fg = "#765702" },
	{ if = "sock", text = "", fg = "#765702" },
	{ if = "sticky", text = "", fg = "#765702" },
	{ if = "dummy", text = "", fg = "#a72f3a" },

	# Fallback
	{ if = "dir", text = "", fg = "#16618b" },
	{ if = "exec", text = "", fg = "#186846" },
	{ if = "!dir", text = "", fg = "#303033" },
]
