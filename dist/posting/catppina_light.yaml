name: "catppina_light"
primary: "#16618b" # buttons, fixed table columns
secondary: "#16618b"  # method selector, some minor labels
accent: "#0f425f"  # header text, scrollbars, cursors, focus highlights
background: "#f7f7f8" # background colors
surface: "#eeeeef"  # panels, etc
error: "#a72f3a"  # error messages
success: "#186846"  # success messages
warning: "#765702"  # warning messages
dark: "false"

text_area:
  cursor: "reverse #974036"
  cursor_line: "underline #303033"
  selection: "reverse #737378"
  gutter: "bold #186846"
  matched_bracket: "reverse #49494d"

url:
  base: "italic #16618b"
  protocol: "bold #00675f"
  separator: "#303033"

syntax:
  json_key: "italic #16618b"
  json_number: "#944600"
  json_string: "#186846"
  json_boolean: "#116285"
  json_null: "#737378"

method:
  get: "bold #16618b"
  post: "bold #186846"
  put: "bold #765702"
  delete: "bold #a72f3a"
  patch: "bold #00675f"
  options: "bold #485a8c"
  head: "bold #41599c"
